<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <title>Acme Tools: Pricing</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, sans-serif; max-width: 880px; margin: 40px auto; padding: 0 16px; color: #222; }
    .plans { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
    .plan { border: 1px solid #ddd; border-radius: 8px; padding: 20px; }
    .price { font-size: 28px; font-weight: 600; }
  </style>
</head>
<body>
  <h1>Acme Tools</h1>
  <p>Τιμολόγηση. Αυτή η σελίδα είναι mock για το demo. Αλλάζεις την τιμή του Pro για να δείξεις την ανίχνευση αλλαγής.</p>
  <div class="plans">
    <div class="plan">
      <h2>Free</h2>
      <div class="price">0 €</div>
      <p>billing: monthly</p>
      <p>Έως 2 projects</p>
    </div>
    <div class="plan">
      <h2>Pro</h2>
      <div class="price">20 €</div>
      <p>billing: monthly</p>
      <p>Έως 10 projects</p>
    </div>
    <div class="plan">
      <h2>Team</h2>
      <div class="price">Custom</div>
      <p>billing: yearly</p>
      <p>Απεριόριστα projects</p>
    </div>
  </div>
</body>
</html>
